[project]
name = "peoplelens"
version = "1.0.0"
description = "PeopleLens — Workforce Intelligence & Planning (synthetic-data portfolio project)"
requires-python = ">=3.10"
authors = [{ name = "Ayush Khandelwal" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B023", "B905", "B017"]
