[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
borderColor = "#E2E8F0"
showWidgetBorder = true

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme.sidebar]
backgroundColor = "#0B1B3A"
secondaryBackgroundColor = "#14284D"
textColor = "#E2E8F0"
primaryColor = "#2DD4BF"
borderColor = "#24406E"
